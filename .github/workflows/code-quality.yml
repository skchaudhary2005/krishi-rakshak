name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Python dependencies
      run: |
        pip install pylint black flake8
        
    - name: Install Node dependencies
      run: npm ci
      
    - name: Run Python linters
      run: |
        echo "Running pylint..."
        pylint *.py --exit-zero --max-line-length=100 > pylint-report.txt || true
        
        echo "Running black..."
        black --check *.py || true
        
        echo "Running flake8..."
        flake8 *.py --max-line-length=100 --exit-zero || true
        
    - name: Run TypeScript linters
      run: |
        echo "Running ESLint..."
        npm run lint || true
        
        echo "Running TypeScript compiler..."
        npx tsc --noEmit || true
        
    - name: Comment PR with results
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const pylintReport = fs.readFileSync('pylint-report.txt', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Code Quality Report\n\n### Python (Pylint)\n\`\`\`\n${pylintReport.slice(0, 2000)}\n\`\`\`\n`
          });
      if: github.event_name == 'pull_request' && false  # Enable when ready